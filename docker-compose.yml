version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: epaper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epaper
      POSTGRES_PASSWORD: epaper_password
      POSTGRES_DB: epaper_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epaper -d epaper_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: epaper_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epaper_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://epaper:epaper_password@postgres:5432/epaper_saas
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_DIR: /app/storage_data
      SECRET_KEY: production-multi-tenant-epaper-secret-key
    volumes:
      - storage_data:/app/storage_data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epaper_frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    container_name: epaper_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
