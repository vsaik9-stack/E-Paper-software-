version: "3.9"

# Isolated Docker Stack for Disha Daily (epaper.dishadaily.com)
services:
  postgres_dishadaily:
    image: postgres:16-alpine
    container_name: epaper_db_dishadaily
    restart: unless-stopped
    environment:
      POSTGRES_USER: epaper
      POSTGRES_PASSWORD: epaper_dishadaily_pass
      POSTGRES_DB: epaper_dishadaily
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  backend_dishadaily:
    build: ./backend
    container_name: epaper_api_dishadaily
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/storage:/app/storage_data
    ports:
      - "8101:8000"
    depends_on:
      - postgres_dishadaily

  frontend_dishadaily:
    build: ./frontend
    container_name: epaper_web_dishadaily
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend_dishadaily:8000
      NEXT_PUBLIC_SINGLE_TENANT_SLUG: dishadaily
    ports:
      - "8201:3000"
    depends_on:
      - backend_dishadaily
